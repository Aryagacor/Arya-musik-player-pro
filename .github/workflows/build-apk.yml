
name: BUILD ARYA MUSIC PLAYER APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -o "Musik pplayer by arya (2).zip" -d source
          find source -maxdepth 3 -type f | head -100

      - name: Prepare Android project
        run: |
          echo "Memeriksa struktur proyek..."
          if [ ! -f source/gradlew ]; then
            echo "ZIP belum berisi proyek Android Gradle."
            echo "Perlu dibuatkan wrapper Android WebView terlebih dahulu."
            exit 1
          fi

      - name: Build APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARYA-MUSIC-PLAYER-APK
          path: source/**/build/outputs/apk/debug/*.apk
          
