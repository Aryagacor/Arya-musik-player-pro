
name: ARYA MUSIC PLAYER PRO - APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Find and Extract ZIP
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

      - name: Inspect Project
        run: |
          find source -maxdepth 5 -type f | head -150

      - name: Check Android Project
        run: |
          if [ ! -f source/gradlew ]; then
            echo "Proyek Android Gradle belum tersedia."
            echo "ZIP HTML membutuhkan Android WebView wrapper."
            exit 1
          fi

      - name: Build APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARYA-MUSIC-PLAYER-PRO-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
